# Slipstream Pure — DNS Resolver Configuration
# Добавить новый резолвер: скопировать блок [[resolver]] и заполнить поля
# ip — обязательно, doh/ech — опционально

# === Cloudflare ===
[[resolver]]
name = "Cloudflare"
ip = ["1.1.1.1", "1.0.0.1"]
doh = "https://cloudflare-dns.com/dns-query"
ech = true

# === Google ===
[[resolver]]
name = "Google"
ip = ["8.8.8.8", "8.8.4.4"]
doh = "https://dns.google/dns-query"
ech = false

